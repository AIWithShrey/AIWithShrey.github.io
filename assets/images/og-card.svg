<svg width="1200" height="630" xmlns="http://www.w3.org/2000/svg">
  <!-- Background -->
  <rect width="1200" height="630" fill="#050505"/>

  <!-- Grid pattern -->
  <defs>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="rgba(0,240,255,0.06)" stroke-width="0.5"/>
    </pattern>
  </defs>
  <rect width="1200" height="630" fill="url(#grid)"/>

  <!-- Corner accent lines -->
  <line x1="0" y1="0" x2="200" y2="0" stroke="#00f0ff" stroke-width="3" opacity="0.5"/>
  <line x1="0" y1="0" x2="0" y2="200" stroke="#ff00ff" stroke-width="3" opacity="0.5"/>
  <line x1="1200" y1="630" x2="1000" y2="630" stroke="#ff00ff" stroke-width="3" opacity="0.5"/>
  <line x1="1200" y1="630" x2="1200" y2="430" stroke="#00f0ff" stroke-width="3" opacity="0.5"/>

  <!-- Subtle glow -->
  <ellipse cx="400" cy="315" rx="300" ry="200" fill="rgba(0,240,255,0.03)"/>

  <!-- Name -->
  <text x="80" y="250" font-family="'Courier New', monospace" font-size="58" font-weight="bold" fill="white" letter-spacing="3">SHREYAS MOCHERLA</text>

  <!-- Title -->
  <text x="80" y="310" font-family="'Courier New', monospace" font-size="26" fill="#00f0ff" letter-spacing="2">CLOUD-NATIVE AI ENGINEER AT NIRMATA</text>

  <!-- Badge: Kubestronaut -->
  <rect x="80" y="350" width="420" height="36" rx="4" fill="rgba(0,240,255,0.1)" stroke="#00f0ff" stroke-width="1"/>
  <text x="96" y="374" font-family="'Courier New', monospace" font-size="14" fill="#00f0ff" letter-spacing="1">CNCF KUBESTRONAUT (13/16 TOWARD GOLDEN)</text>

  <!-- Badge: KubeCon -->
  <rect x="520" y="350" width="300" height="36" rx="4" fill="rgba(255,0,255,0.1)" stroke="#ff00ff" stroke-width="1"/>
  <text x="536" y="374" font-family="'Courier New', monospace" font-size="14" fill="#ff80ff" letter-spacing="1">KUBECON INDIA 2026 SPEAKER</text>

  <!-- Badge: CNCF Blog -->
  <rect x="80" y="400" width="220" height="36" rx="4" fill="rgba(242,233,0,0.1)" stroke="#f2e900" stroke-width="1"/>
  <text x="96" y="424" font-family="'Courier New', monospace" font-size="14" fill="#f2e900" letter-spacing="1">CNCF BLOG AUTHOR</text>

  <!-- URL -->
  <text x="80" y="560" font-family="'Courier New', monospace" font-size="18" fill="rgba(255,255,255,0.3)" letter-spacing="1">aiwithshrey.github.io</text>

  <!-- Decorative dots -->
  <circle cx="1050" cy="100" r="2" fill="#f2e900" opacity="0.3"/>
  <circle cx="1080" cy="130" r="2" fill="#00f0ff" opacity="0.3"/>
  <circle cx="1100" cy="90" r="2" fill="#ff00ff" opacity="0.3"/>
  <circle cx="1030" cy="150" r="2" fill="#f2e900" opacity="0.2"/>
  <circle cx="1120" cy="120" r="2" fill="#00f0ff" opacity="0.2"/>
</svg>
