<!DOCTYPE html>
<html lang="{{ page.lang | default: "en" }}" class="html" data-theme="{{ site.theme_config.appearance | default: "auto" }}">
        {%- include head.html -%}
  <body>
    <!-- Skip link for accessibility -->
    <a href="#main-content" class="skip-link">Skip to main content</a>

    <!-- Scroll Progress Indicator -->
    <div class="scroll-progress" aria-hidden="true"></div>

    <!-- HUD Overlay -->
    {%- include hud-overlay.html -%}

    <!-- Ambient Background -->
    <div class="ambient-bg" aria-hidden="true">
      <div class="ambient-bg__gradient"></div>
      <div class="ambient-bg__grid"></div>
    </div>

    <!-- Film Grain Overlay -->
    <svg class="grain-overlay" aria-hidden="true">
      <filter id="grain-filter">
        <feTurbulence type="fractalNoise" baseFrequency="0.6" numOctaves="3" stitchTiles="stitch"/>
      </filter>
      <rect width="100%" height="100%" filter="url(#grain-filter)"/>
    </svg>
    <main id="main-content" class="page-content" aria-label="Content">
      <div class="w">
        {{ content }}
        {% if site.theme_config.appearance_toggle %}
          {% include toggle_theme_button.html %}
        {% endif %}
        <!-- copyright handled by layout footers -->
      </div>
    </main>

    <script src="{{ '/assets/js/view-transitions.js' | relative_url }}"></script>
  </body>
</html>
