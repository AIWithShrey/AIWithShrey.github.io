<header class="site-header">
  <div class="site-header-content">
    <a href="{{ '/' | relative_url }}" class="site-logo">
      <img src="{{ '/assets/images/Circle_cropped.png' | relative_url }}" alt="Home">
    </a>

    <button class="nav-toggle" aria-label="Toggle navigation" aria-expanded="false">
      <span class="nav-toggle__bar"></span>
      <span class="nav-toggle__bar"></span>
      <span class="nav-toggle__bar"></span>
    </button>

    <nav class="site-nav" aria-label="Main navigation">
      {% for item in site.data.home.navbar_entries %}
      <a href="{{ item.url | relative_url }}" class="site-nav__link{% if page.url == item.url %} site-nav__link--active{% endif %}">
        {{ item.title }}
      </a>
      {% endfor %}
    </nav>
  </div>
</header>

<script>
document.addEventListener('DOMContentLoaded', function() {
  var toggle = document.querySelector('.nav-toggle');
  var nav = document.querySelector('.site-nav');
  if (toggle && nav) {
    toggle.addEventListener('click', function() {
      var expanded = toggle.getAttribute('aria-expanded') === 'true';
      toggle.setAttribute('aria-expanded', String(!expanded));
      nav.classList.toggle('site-nav--open');
    });
  }
});
</script>
